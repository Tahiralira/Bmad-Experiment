# gzip (WS9/S6-H4): compress text assets on the wire. Static+CSS+JS come out
# of nginx, so this is where the ~170 kB main chunk gets its transfer size.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml
           text/plain application/xml application/manifest+json;

server {
  listen 80;

  # Security headers (WS8/S5-M1). add_header only applies when the response
  # has no header of the same name; `always` covers error responses too.
  # NOTE: caching below uses `expires`, NOT add_header — a location-level
  # add_header would silently drop every server-level header in that location.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # SPA CSP: self-hosted scripts/styles only (WS3: 0 external fonts, no
  # CDNs). style 'unsafe-inline' is required by runtime style attributes;
  # connect-src allows same-origin plus the https API origin.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  # HSTS is safe unconditionally here: this vhost is only reached via
  # Traefik TLS in staging/production; local dev uses the Vite server.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  root /usr/share/nginx/html;
  index index.html index.htm;

  # Vite emits content-hashed filenames under /assets — cache them hard
  # (a new build produces new names, so stale caches are impossible).
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    # index.html (and every SPA route that falls back to it) must revalidate
    # on each load, or users keep running last week's bundle.
    expires -1;
    try_files $uri /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
