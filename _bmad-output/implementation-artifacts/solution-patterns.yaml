# Solution Patterns Log
# =====================
# Tracks problems encountered and their solutions to avoid repeating mistakes.
# This file is automatically checked at the start of each session/workflow.
#
# FORMAT: Problem -> Root Cause -> Solution -> Prevention
# GOAL: Save tokens by not re-debugging known issues
#
# Created: 2026-01-12
# Last Updated: 2026-08-31 (WS13: DOCKER-009 cp nesting silently keeps stale code;
#               TEST-010 hardcoded now vs relative fixtures; TEST-011 Playwright
