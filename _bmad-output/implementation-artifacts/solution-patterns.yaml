# =============================================================================
# DOCKER PATTERNS
# =============================================================================

docker:
  - id: "DOCKER-001"
    title: "Poetry/pip packages not found after container rebuild"
    symptoms:
      - "ModuleNotFoundError in container"
      - "Package installed locally but not in Docker"
    root_cause: "Docker layer caching doesn't pick up new dependencies"
    solution: |
      1. Rebuild without cache: `docker compose build --no-cache backend`
      2. Or copy requirements explicitly in Dockerfile
      3. Or use volume mount for development
    prevention: "Always rebuild containers after adding dependencies"
    stories_encountered: ["1.1", "1.3"]
    tokens_saved_estimate: "~500 per occurrence"

  - id: "DOCKER-002"
    title: "Database connection refused in tests"
    symptoms:
      - "Connection refused to localhost:5432"
      - "Tests pass locally, fail in Docker"
    root_cause: "Container networking - 'localhost' inside container != host"
    solution: |
      Use service name instead of localhost:
      - In docker-compose: `db` not `localhost`
      - Or use `host.docker.internal` for host access
    prevention: "Always use service names in Docker environments"
    stories_encountered: ["1.3"]
    tokens_saved_estimate: "~300 per occurrence"

  - id: "DOCKER-003"
    title: "Windows Docker volume sync lag"
    symptoms:
      - "File changes on Windows host not visible in container"
      - "pytest shows fewer tests than expected"
      - "Code changes don't take effect"
    root_cause: "Windows Docker Desktop volume mounts can have sync delays"
    solution: |
      1. Copy files explicitly: `docker compose cp local/path container:/path`
      2. Or restart container: `docker compose restart backend`
      3. Or check Docker Desktop settings for file sharing
    prevention: "Use docker compose cp when files must sync immediately"
    stories_encountered: ["3.1"]
    tokens_saved_estimate: "~300 per occurrence"

  - id: "DOCKER-004"
    title: "File permissions issues with mounted volumes"
    symptoms:
      - "Permission denied when writing files"
      - "Root-owned files in mounted directories"
    root_cause: "Container runs as root, host has different UID"
    solution: |
      1. Add user mapping in docker-compose:
         ```yaml
         user: "${UID}:${GID}"
         ```
      2. Or set permissions in Dockerfile:
         ```dockerfile
         RUN chown -R app:app /app
         ```
    prevention: "Define user in Dockerfile for development containers"
    stories_encountered: []
    tokens_saved_estimate: "~400 per occurrence"

# =============================================================================
# DATABASE PATTERNS
# =============================================================================

database:
  - id: "DB-001"
    title: "Alembic migration conflicts"
    symptoms:
      - "Multiple heads detected"
      - "Target database is not up to date"
    root_cause: "Multiple developers created migrations from same base"
    solution: |
      1. Check heads: `alembic heads`
      2. Merge: `alembic merge -m "merge" rev1 rev2`
      3. Or delete conflicting migration and regenerate
    prevention: "Always pull latest before creating migrations"
    stories_encountered: []
    tokens_saved_estimate: "~600 per occurrence"

  - id: "DB-002"
    title: "SQLModel relationship not loading"
    symptoms:
      - "Related objects are None"
      - "Lazy loading not working"
    root_cause: "SQLModel requires explicit relationship configuration"
    solution: |
      Use `Relationship` with `back_populates`:
      ```python
      class User(SQLModel, table=True):
          items: list["Item"] = Relationship(back_populates="owner")

      class Item(SQLModel, table=True):
          owner_id: uuid.UUID = Field(foreign_key="user.id")
          owner: User = Relationship(back_populates="items")
      ```
    prevention: "Always define both sides of relationships"
    stories_encountered: ["1.3", "2.1"]
    tokens_saved_estimate: "~400 per occurrence"

  - id: "DB-003"
    title: "Alembic autogenerate flags enum/timestamp/FK diffs on every table"
    symptoms:
      - "alembic check reports dozens of modify_type / remove_fk operations"
      - "Detected type change from VARCHAR to Enum(...) on every status column"
      - "Detected type change from TIMESTAMP(timezone=True) to DateTime()"
    root_cause: |
      SQLModel's default column rendering (naive DateTime, native sa.Enum, no
      FK ondelete) doesn't match the hand-written migrations. The DB was
      right; the models were lazy.
    solution: |
      Make models render the migrations' exact DDL (WS5, B-H9):
      1. Timestamps: `Field(..., sa_type=sa.DateTime(timezone=True))`
      2. Enum columns: `sa_type=sa.Enum(MyEnum, native_enum=False, length=N)`
         - CRITICAL: SQLAlchemy enum columns store NAMES ("DRAFT"), so never
           switch the model to sa.String — new rows would store values
           ("draft") and silently mismatch existing data.
      3. FK policy: `Field(foreign_key=..., ondelete="CASCADE"/"RESTRICT")`
      4. Declare DB-only indexes/constraints in __table_args__
         (ix_user_oauth_provider_id, uq_settlement_claim_split).
      Verify with `docker compose exec backend alembic check` — it must say
      "No new upgrade operations detected".
    prevention: "Run `alembic check` before finishing any story that touches models; new datetime/enum/FK fields must use the sa_type/ondelete forms above"
    stories_encountered: ["WS5"]
    tokens_saved_estimate: "~1500 per occurrence"

# =============================================================================
# IMPORT / CIRCULAR DEPENDENCY PATTERNS
# =============================================================================

imports:
  - id: "IMPORT-001"
    title: "Circular import between feature modules"
    symptoms:
      - "ImportError: cannot import name X"
      - "Partially initialized module"
    root_cause: "Module A imports B, B imports A"
    solution: |
      Options (in order of preference):
      1. Move shared types to a common module
      2. Use TYPE_CHECKING for type hints only:
         ```python
         from typing import TYPE_CHECKING
         if TYPE_CHECKING:
             from app.features.groups.models import ExpenseGroup
         ```
      3. Import inside function (last resort, add comment explaining why)
    prevention: "Plan module dependencies before implementing"
    stories_encountered: ["2.4"]
    tokens_saved_estimate: "~300 per occurrence"
    example_file: "backend/app/features/auth/service.py:266"

# =============================================================================
# FRONTEND PATTERNS
# =============================================================================

frontend:
  - id: "FE-001"
    title: "TanStack Router file-based route not found"
    symptoms:
      - "Route not matching"
      - "404 on navigation"
    root_cause: "File naming must match route pattern exactly"
    solution: |
      Route structure:
      - `/` → `routes/_layout/index.tsx`
      - `/groups` → `routes/_layout/groups/index.tsx`
      - `/groups/:id` → `routes/_layout/groups/$id.tsx`

      Use `_layout` prefix for layout routes.
    prevention: "Check TanStack Router docs for file conventions"
    stories_encountered: ["2.4"]
    tokens_saved_estimate: "~200 per occurrence"

  - id: "FE-002"
    title: "TanStack Query not refetching after mutation"
    symptoms:
      - "Data stale after create/update"
      - "Need to refresh to see changes"
    root_cause: "Query cache not invalidated"
    solution: |
      Invalidate queries after mutation:
      ```typescript
      const queryClient = useQueryClient()

      const mutation = useMutation({
        mutationFn: createGroup,
        onSuccess: () => {
          queryClient.invalidateQueries({ queryKey: ["groups"] })
        },
      })
      ```
    prevention: "Always invalidate related queries in mutation onSuccess"
    stories_encountered: ["2.1"]
    tokens_saved_estimate: "~250 per occurrence"

  - id: "FE-003"
    title: "TypeScript error: 'React' is declared but its value is never read"
    symptoms:
      - "TS6133: 'React' is declared but its value is never read"
      - "Build fails with unused import warning"
    root_cause: "React 17+ with new JSX transform doesn't require importing React for JSX"
    solution: |
      Remove unused React import:
      ```typescript
      // WRONG - React import not needed for JSX
      import * as React from "react"
      import { useMemo } from "react"

      // CORRECT - Import only what you use
      import { useMemo } from "react"
      ```
    prevention: "Only import React when using React-specific APIs (React.useRef, React.ComponentType, etc.)"
    stories_encountered: ["2.5.6"]
    tokens_saved_estimate: "~100 per occurrence"

  - id: "FE-005"
    title: "Optimistic UI without error recovery leaves UI stuck"
    symptoms:
      - "Card/button shows 'success' state optimistically"
      - "If actual API call fails, UI stays in success state permanently"
      - "User cannot retry or revert"
    root_cause: "Optimistic state set to true but never reset on mutation error"
    solution: |
      Always add a useEffect to revert optimistic state on error:
      ```typescript
      const [isOptimistic, setIsOptimistic] = useState(false)

      // Revert on mutation failure
      useEffect(() => {
        if (mutation.isError && isOptimistic) {
          setIsOptimistic(false)
        }
      }, [mutation.isError, isOptimistic])
      ```
    prevention: "For every optimistic UI update, add error recovery that resets the optimistic state"
    stories_encountered: ["5.1"]
    tokens_saved_estimate: "~300 per occurrence"

  - id: "FE-004"
    title: "Numbers look unnatural in UI - tabular vs proportional figures"
    symptoms:
      - "Numbers in text don't flow naturally"
      - "Monospace appearance in headings/body text"
    root_cause: "Using tabular-nums instead of proportional-nums for inline text"
    solution: |
      Use proportional-nums for UI numbers:
      ```css
      /* WRONG - Makes numbers monospaced */
      .number { font-variant-numeric: tabular-nums; }

      /* CORRECT - Numbers flow with text */
      .number { font-variant-numeric: proportional-nums; }
      ```
      In Tailwind:
      ```tsx
      // WRONG
      className="tabular-nums"

      // CORRECT
      className="proportional-nums"
      ```
      Only use tabular-nums for data tables where alignment matters.
    prevention: "Default to proportional-nums for all UI text. Use tabular-nums only for financial tables/spreadsheets."
    stories_encountered: ["2.5.6"]
    tokens_saved_estimate: "~50 per occurrence"

  - id: "FE-005"
    title: "TanStack Router child route never renders (blank page, no error)"
    symptoms:
      - "New $param route file exists but navigating to it renders the parent page"
      - "Route appears in routeTree.gen.ts but component never mounts"
    root_cause: |
      File-based nesting: `groups.$groupId.tsx` becomes a CHILD of
      `groups.tsx`, and children render inside the parent's <Outlet/>. If the
      parent route has no <Outlet/>, the child silently never renders.
    solution: |
      Un-nest with a trailing underscore on the parent segment:
      `groups_.$groupId.tsx` -> path /groups/$groupId as a standalone page
      (route id "/_layout/groups_/$groupId"). Start the dev server (or vite
      build) to regenerate routeTree.gen.ts before running typecheck.
    prevention: "When adding a detail route next to a list route without an Outlet, use the trailing-underscore filename form"
    stories_encountered: ["WS5"]
    tokens_saved_estimate: "~400 per occurrence"

  - id: "FE-006"
    title: "API monetary amounts are strings, not numbers"
    symptoms:
      - "`.toFixed is not a function` at runtime"
      - "TypeScript types say number but responses contain \"50.00\""
    root_cause: |
      Pydantic serializes Decimal as a JSON string (deliberately - WS4/M1
      Decimal-to-the-wire). Hand-written frontend types that declare `number`
      typecheck fine and explode only at runtime.
    solution: |
      Declare every wire amount as `string` (Expense.amount,
      ExpenseSplit.amount_owed, SettlementClaimPublic.amount, net_balance,
      total_balance). Convert at the display edge: `Number(x)` for
      BalanceDisplay, or render the exact string directly ("Rs {amount}").
    prevention: "Any new response type with money: string, never number. Requests may send numbers."
    stories_encountered: ["WS4", "WS5"]
    tokens_saved_estimate: "~300 per occurrence"

# =============================================================================
# TESTING PATTERNS
# =============================================================================

testing:
  - id: "TEST-001"
    title: "Pytest fixture not found"
    symptoms:
      - "fixture 'X' not found"
    root_cause: "Fixture not in conftest.py or wrong scope"
    solution: |
      1. Check fixture is in `conftest.py` (not just test file)
      2. Check fixture scope matches usage
      3. Check fixture name matches exactly (case-sensitive)
    prevention: "Keep fixtures in conftest.py at appropriate level"
    stories_encountered: []
    tokens_saved_estimate: "~150 per occurrence"

  - id: "TEST-002"
    title: "Test database not cleaned between tests"
    symptoms:
      - "Tests pass individually, fail together"
      - "Duplicate key errors"
    root_cause: "Database state leaking between tests"
    solution: |
      Use transaction rollback or truncate:
      ```python
      @pytest.fixture
      def db(session):
          yield session
          session.rollback()  # Rollback after each test
      ```
    prevention: "Use session-scoped fixtures with rollback"
    stories_encountered: ["1.4"]
    tokens_saved_estimate: "~400 per occurrence"

  - id: "TEST-003"
    title: "String-prefix ValueError for HTTP status code translation"
    symptoms:
      - "Service raises ValueError('NOT_FOUND:...') or ValueError('CONFLICT:...')"
      - "Router parses string prefix to determine HTTP status code"
    root_cause: "Inconsistent error handling pattern — dev invents ad-hoc error translation instead of following existing pattern"
    solution: |
      Use the EXISTING pattern from confirm/reject endpoints:
      1. Router does validation (404 check, status guard) with HTTPException directly
      2. Service does business logic and returns result or sentinel value
      3. Router translates sentinel values to appropriate HTTP status

      WRONG (fragile string-prefix):
      ```python
      # service.py
      raise ValueError("NOT_FOUND:Expense not found")

      # router.py
      except ValueError as e:
          if str(e).startswith("NOT_FOUND:"):
              raise HTTPException(status_code=404, ...)
      ```

      CORRECT (consistent with existing endpoints):
      ```python
      # router.py — validation here
      expense = session.get(Expense, expense_id)
      if not expense:
          raise HTTPException(status_code=404, detail="Expense not found")

      result = expense_service.settle_expense_split(session, expense_id, user_id)
      if not result:
          raise HTTPException(status_code=403, detail="Not involved")
      ```
    prevention: "Always check how EXISTING endpoints handle errors before inventing new patterns"
    stories_encountered: ["5.1"]
    tokens_saved_estimate: "~500 per occurrence"

  - id: "TEST-004"
    title: "Converting a state-changing GET to preview-GET + action-POST silently breaks old tests"
    symptoms:
      - "Tests that 'join via invite link' still pass their status assertion (200) but later steps fail (member missing, splits 400)"
      - "No error points at the invite step itself"
    root_cause: "WS8 split GET /invite/{token} into a read-only preview (still 200) + POST /invite/{token}/accept. Old tests hitting the GET get a valid 200 preview — nothing mutates, and the failure surfaces far downstream."
    solution: |
      When an endpoint's method/semantics change, grep EVERY test call site of
      the old URL, not just the feature's own test file:
        grep -rn "expense-groups/invite/" tests/ | grep -v "/accept"
      WS8 found 8 helper call sites across 7 unrelated test files.
    prevention: "Method/semantic changes to shared endpoints require a repo-wide grep for the URL, because status-code assertions won't catch a read-only 200"
    stories_encountered: ["WS8"]
    tokens_saved_estimate: "~800 per occurrence"

  - id: "TEST-005"
    title: "Testing slowapi rate limits without throttling the whole suite"
    symptoms:
      - "Every test shares the TestClient IP; per-IP limits 429 unrelated tests"
      - "Or: limiter disabled globally and the rate-limit test can't assert anything"
    root_cause: "slowapi's Limiter reads its enabled flag at construction from settings, and storage is process-wide"
    solution: |
      1. Construct the limiter with enabled=settings.RATE_LIMIT_ENABLED
         (app/core/limiter.py).
      2. conftest sets settings.RATE_LIMIT_ENABLED = False BEFORE any app
         import (same pre-import block as the test-DB redirect).
      3. The one test asserting 429s flips `limiter.enabled = True` in a
         try/finally — slowapi checks the flag per-request, so this is safe
         at runtime and the consumed bucket is inert once disabled again.
    prevention: "Never gate rate limiting on ENVIRONMENT (prod parity lost); gate on a dedicated setting the suite can flip"
    stories_encountered: ["WS8"]
    tokens_saved_estimate: "~600 per occurrence"

  - id: "BE-002"
    title: "'Check all X done' pattern ignores entity owner's own record"
    symptoms:
      - "Expense/split never transitions to final status (SETTLED, CONFIRMED)"
      - "check_all_splits_X() returns False even after all non-owner members completed their action"
      - "One split remains in previous status — the payer/creator's own split"
    root_cause: "In split-based workflows, the expense payer/creator also has a split. When other members settle/confirm, the payer's split isn't explicitly handled because 'the payer doesn't owe themselves.' But the check-all function requires ALL splits."
    solution: |
      When processing the last member action (e.g., settlement confirmation), also auto-settle the payer's split:
      ```python
      # In confirm_settlement_claim, after settling claimant's split:
      payer_split = session.exec(
          select(ExpenseSplit)
          .where(ExpenseSplit.expense_id == expense.id)
          .where(ExpenseSplit.user_id == expense.payer_id)
      ).first()
      if payer_split and payer_split.status != SplitStatus.SETTLED:
          payer_split.status = SplitStatus.SETTLED
          session.add(payer_split)
      ```
    prevention: "When using 'check all X' patterns, verify whether ALL entities can realistically reach the target status, or if the owner's record needs auto-transition"
    stories_encountered: ["5.2"]
    tokens_saved_estimate: "~600 per occurrence"

  - id: "BE-003"
    title: "EXISTS subquery auto-correlates itself away when its table is already in the outer FROM"
    symptoms:
      - "sqlalchemy.exc.InvalidRequestError: Select statement returned no FROM clauses due to auto-correlation"
      - "Query with .exists() works alone but fails once the outer query joins the same table"
    root_cause: >
      SQLAlchemy auto-correlates subqueries: any table that also appears in
      the enclosing query is removed from the subquery's FROM list. If the
      subquery selects FROM only that table, nothing is left (WS6: an
      ExpenseSplit EXISTS filter inside a query that already joined
      ExpenseSplit).
    solution: |
      Alias the table inside the subquery so it is a distinct FROM element:
      ```python
      participant_split = sa.orm.aliased(ExpenseSplit)
      stmt = stmt.where(
          select(participant_split.id).where(
              participant_split.expense_id == Expense.id,
              participant_split.user_id == user_id,
          ).exists()
      )
      ```
    prevention: "Any correlated subquery over a table the outer query already uses must alias that table"
    stories_encountered: ["WS6"]
    tokens_saved_estimate: "~400 per occurrence"

  - id: "BE-004"
    title: "SSE/StreamingResponse generators outlive the request's session and ORM instances"
    symptoms:
      - "Streaming endpoint emits a generic error event on the success path"
      - "DetachedInstanceError / lazy-load exception raised mid-stream"
      - "Works in unit tests of the service, fails through the endpoint"
    root_cause: >
      A StreamingResponse generator runs AFTER the endpoint function returns
      and FastAPI dependency teardown closes the DB session. Any expired ORM
      attribute access inside the generator (e.g. current_user.id after a
      commit expired the instance) tries to refresh against a dead session
      (WS7: the parse endpoint's complete event).
    solution: |
      Do ALL DB work in the endpoint body before returning StreamingResponse:
      membership/authz checks, quota reservation, settings reads — and COMMIT
      there (once streaming starts there is no "after" to commit in; ARCH-001
      one-commit rule holds with the commit relocated). Snapshot every ORM
      value the generator needs into plain locals first:
      ```python
      payer_id = current_user.id   # BEFORE session.commit()/return
      session.commit()
      async def event_generator():
          ...  # uses payer_id, never current_user
      return StreamingResponse(event_generator(), ...)
      ```
      Bonus honesty: pre-stream failures can then be real HTTP errors
      (403/429/503) instead of error events inside a 200.
    prevention: "Streaming generators touch no session and no ORM instances — plain values only, captured before return"
    stories_encountered: ["WS7"]
    tokens_saved_estimate: "~800 per occurrence"

  - id: "TEST-006"
    title: "Mock 'assertions' that never asserted — exposed by Python 3.13"
    symptoms:
      - "AttributeError: 'called_once_with' is not a valid assertion (py3.13)"
      - "A mock-based test that passed for years fails after a Python bump"
    root_cause: |
      `mock.called_once_with(...)` / `mock.assert_called()` typos return a
      truthy Mock on old Pythons — the test asserts nothing. Python 3.13's
      unittest.mock rejects misspelled assertion names, surfacing the fake.
      Often paired with a second fake: patching "sqlmodel.Session" does not
      intercept modules that did `from sqlmodel import Session` — patch the
      NAME IN THE MODULE UNDER TEST ("app.x.Session"), then check the mock
      was actually exercised (WS9 found call_count == 0 once patched right).
    solution: |
      Use real assertion methods (assert_called_once_with / assert_called_once)
      and patch where the name is looked up, not where it is defined.
    prevention: "Any `assert mock.<something>(...)` line is a bug; grep for `\\.called_once` on Python upgrades"
    stories_encountered: ["WS9"]
    tokens_saved_estimate: "~400 per occurrence"

  - id: "TEST-007"
    title: "Playwright suite shares ONE account, so every test lands in the same /pending queue"
    symptoms:
      - "A journey passes on the first run and fails on the next, with no code change"
      - "strict mode violation: getByText('1 member') resolved to 6 elements"
      - "toHaveCount(0) fails right after clicking Confirm — the row is still there"
    root_cause: |
      The chromium project reuses one storageState (playwright/.auth/user.json),
      so ALL tests act as the same person. Three consequences bit at once (WS11):
      (1) `/pending` and `/groups` span every group that account belongs to, so
      parallel workers see each other's rows; (2) hardcoded expense descriptions
      ("WS11 dinner" in two tests) collided; (3) `getByRole("button",
      {name: /^Confirm/}).first()` clicked whatever was on top — often another
      test's expense — leaving the target pending.
      A fourth, separate race: TanStack Router flips the URL before the new route
      renders, so `waitForURL` returns while the previous LIST is still mounted.
    solution: |
      Three rules, all applied in tests/utils/groups.ts (WS11):
      1. Unique labels per test — `uniqueLabel("WS11 dinner")`, never a literal.
      2. Never `.first()` on a shared list. Scope to the row:
         `page.locator('[data-slot="card"]').filter({ hasText: description })`,
         then click inside it (`actOnPending`).
      3. After `waitForURL`, wait for something only the DESTINATION renders
         (the detail `<h1>`) before asserting anything else.
      Verified by running the full suite 9 consecutive times, not once.
    prevention: "A single green e2e run proves nothing when the suite shares an account — run it 3+ times before calling it green. Any assertion on a cross-group screen (/pending, /groups) must be scoped to a row."
    stories_encountered: ["WS11"]
    tokens_saved_estimate: "~3000 per occurrence"

  - id: "TEST-008"
    title: "The e2e suite trips the app's own per-IP auth rate limit (429)"
    symptoms:
      - "registerAndSignIn hangs at the 'Check your email' heading"
      - "backend logs: WARNING:slowapi:ratelimit 10 per 1 minute (172.18.0.1) exceeded"
      - "Failures move around between runs and vanish when one spec runs alone"
    root_cause: |
      AUTH_LIMIT is 10/minute per IP (WS8). Every journey registers real users
      through the real endpoint, so a 12-test run makes ~20 registrations from
      one IP in well under a minute and throttles itself.
    solution: |
      `RATE_LIMIT_AUTH` setting (WS11), default "10/minute" so production is
      unchanged; the e2e stack sets 1000/minute (ci.yml + local .env). Only the
      auth tier moves — the global 200/minute default and the AI-parse and
      invite-preview tiers stay fixed, and rate limiting stays ENABLED.
      AUTH_LIMIT is a *callable* so slowapi re-reads it per request; that is
      what lets test_ws8_security pin 10/minute via monkeypatch and stay honest
      on a machine whose .env raises it.
    prevention: "A security test must never inherit its threshold from ambient env — pin it in the test (same lesson as the WS10.6 analytics tests). When e2e failures wander between specs, check the backend log for 429 before suspecting selectors."
    stories_encountered: ["WS11"]
    tokens_saved_estimate: "~2500 per occurrence"

  - id: "DOCKER-005"
    title: "Slim/new-Python image build fails compiling a locked package"
    symptoms:
      - "error: command 'gcc' failed: No such file or directory during uv sync"
      - "Build worked on the fat base image, fails on -slim or a newer Python"
    root_cause: |
      The locked version of a native package predates the new Python's wheels
      (WS9: httptools 0.6.1 had no cp313 wheel), so pip/uv falls back to an
      sdist build needing a compiler that slim images don't ship.
    solution: |
      Do NOT apt-get install gcc. Upgrade just the affected family so wheels
      exist, e.g.:
        uv lock --upgrade-package httptools --upgrade-package uvloop \
          --upgrade-package uvicorn --upgrade-package watchfiles \
          --upgrade-package websockets
      (`uv lock --check` still passes — pyproject is unchanged.) No host uv?
      Run it in a container: python:3.13-slim + `pip install uv`.
      NOTE: the ghcr.io/astral-sh/uv image is distroless (COPY --from only) —
      it cannot be `docker run` directly.
    prevention: "When bumping the base Python, expect the oldest locked native deps (uvloop/httptools family) to need a targeted relock"
    stories_encountered: ["WS9"]
    tokens_saved_estimate: "~600 per occurrence"

  - id: "DOCKER-006"
    title: "Tests are volume-mounted but app code runs from a stale image"
    symptoms:
      - "A test asserting brand-new behavior fails although the source clearly implements it"
      - "pytest failure output shows values only the OLD code could produce"
    root_cause: |
      docker-compose.override.yml mounts only backend/tests (and htmlcov)
      into the container — app/ code executes from the built image. After
      changing app code (or switching branches), pytest runs NEW tests
      against OLD application code (WS9.6: WS9.5's sslmode DSN test failed
      because the image predated the config change).
    solution: |
      docker compose build backend && docker compose up -d backend, then
      re-run pytest. Verify what the container actually runs with:
      docker compose exec backend grep <new-symbol> //app/app/<file>.py
    prevention: "Before trusting an in-container test result after app-code changes, rebuild the backend image; only tests/ hot-reloads"
    stories_encountered: ["WS9.6"]
    tokens_saved_estimate: "~500 per occurrence"

  - id: "FE-007"
    title: "nginx location-level add_header silently drops security headers"
    symptoms:
      - "Security headers present on / but missing on /assets/* (or vice versa)"
    root_cause: |
      nginx `add_header` inherits from the enclosing block ONLY if the
      location has no add_header of its own — one add_header for caching
      wipes every inherited security header in that location.
    solution: |
      Set cache headers with `expires` (not add_header) inside locations:
      `expires 1y;` for hashed /assets/, `expires -1;` (Cache-Control:
      no-cache) for index.html — server-level security headers keep flowing.
    prevention: "Never use add_header inside a location that must inherit server-level headers; verify with curl -sI on BOTH / and an asset"
    stories_encountered: ["WS9"]
    tokens_saved_estimate: "~300 per occurrence"

  - id: "FE-008"
    title: "Playwright pixel proof against the local nginx build (stale bundle + CSP wall)"
    symptoms:
      - "New frontend UI doesn't appear at localhost:5173 even after npm run build"
      - "Console: 'Connecting to http://localhost:8000 violates CSP directive connect-src self https:' — all API calls blocked (WS10.1 mislabeled this 'CORS-blocked')"
    root_cause: |
      Two independent walls. (1) The frontend container serves an IMAGE-BAKED
      bundle from /usr/share/nginx/html — a host `npm run build` writes to
      frontend/dist, which nginx never sees. (2) WS8's nginx.conf ships a strict
      CSP (connect-src 'self' https:) that blocks the plain-http
      localhost:8000 API in local dev.
    solution: |
      1. Serve the fresh build: `docker compose cp frontend/dist/. frontend:/usr/share/nginx/html/`
      2. Mint a JWT in-container (security.create_access_token) and drive Playwright:
         context({ bypassCSP: true }); addInitScript sets localStorage
         access_token + vite-ui-theme (dark/light); goto the route; fullPage
         screenshot. bypassCSP only affects the test browser — prod CSP is
         verified by WS8's suite, never weakened.
      Seed demo users with @*.example.com (email-validator rejects .local/.test).
    prevention: "For frontend pixel proof on this project use Playwright + bypassCSP + docker-cp'd dist; the browser-pane/preview screenshot tools hang here (WS3+)"
    stories_encountered: ["WS10.2"]
    tokens_saved_estimate: "~800 per occurrence"

  - id: "FE-009"
    title: "Pixel proof for UI that needs a live backend/AI — intercept, don't wire"
    symptoms:
      - "A screenshot needs a logged-in user, seeded data, or an AI response"
      - "The nginx build blocks the :8000 API (CSP) and there's no GEMINI_API_KEY"
    root_cause: |
      Driving the real stack for a screenshot means fighting the CSP wall
      (FE-008), CORS from :5173→:8000, auth seeding, AND any external service
      (Gemini) that isn't configured locally.
    solution: |
      Decouple the screenshot from the backend with Playwright request
      interception (WS10.4). In a launched-chromium script:
      1. context({ bypassCSP: true, colorScheme, viewport }); addInitScript sets
         localStorage access_token (any value — isLoggedIn() only checks
         presence) + vite-ui-theme (light/dark).
      2. page.route the API with canned responses: JSON for reads, and a
         hand-rolled SSE body ("data: {...}\n\n" frames ending in a `complete`
         event) for the streaming parse endpoint.
      CRITICAL: register the CATCH-ALL route (**/api/v1/**) FIRST — Playwright
      matches routes in REVERSE registration order, so specific routes must be
      registered AFTER the catch-all to win.
      docker-cp the fresh dist into the frontend container first (FE-008); the
      script hits http://localhost:5173 and every /api call is intercepted.
    prevention: "When a screenshot's only blocker is live data/AI, intercept the API in Playwright rather than provisioning the backend; catch-all route registered first"
    stories_encountered: ["WS10.4"]
    tokens_saved_estimate: "~700 per occurrence"

  - id: "FE-010"
    title: "posthog-js loads a remote config.js script that a script-src 'self' CSP blocks"
    symptoms:
      - "PostHog fetches https://us-assets.i.posthog.com/array/<key>/config.js as a <script>"
      - "Would be silently blocked in production (CSP script-src 'self') — flags/config never load"
    root_cause: |
      By default posthog-js pulls remote config + feature flags at init: a
      config.js SCRIPT from us-assets.i.posthog.com plus a /flags XHR. The
      XHR passes connect-src 'self' https:, but the script tag violates
      script-src 'self' (vercel.json + nginx, WS8).
    solution: |
      Init with `advanced_disable_flags: true` (WS10.6, lib/analytics.ts).
      The SDK logs "Remote config is disabled. Falling back to local config"
      and the ONLY outbound traffic left is the /e/ capture endpoint over
      fetch — verified in the browser via performance.getEntriesByType
      ("resource"). We use no PostHog feature flags, so nothing is lost.
    prevention: "Any new PostHog surface (or SDK bump) must keep advanced_disable_flags:true unless the CSP gains the posthog assets host; verify with the resource-entries check"
    stories_encountered: ["WS10.6"]
    tokens_saved_estimate: "~400 per occurrence"

  - id: "FE-011"
    title: "Service worker never registers in the in-app Browser pane — the app is fine, the browser is not"
    symptoms:
      - "navigator.serviceWorker.getRegistrations() returns [] after load"
      - "TypeError: Failed to register a ServiceWorker ... An unknown error occurred when fetching the script."
      - "The SAME url fetched with fetch() returns 200 with content-type application/javascript"
      - "Registering ANY script fails identically (sw.js and registerSW.js both)"
    root_cause: |
      The embedded Browser pane (mcp__Claude_Browser__*) does not permit
      service worker script fetches. Nothing about the app causes it: the
      script is served 200 same-origin with the right content-type, and the
      WS8 CSP allows it (worker-src falls back through child-src to
      script-src 'self'). The giveaway is that a plain fetch() of the exact
      same URL succeeds while register() fails, and that an unrelated second
      script fails with a byte-identical message.
    solution: |
      Do not debug the app. Verify service workers in real Chromium instead
      — Playwright is already installed, so a ~40-line script that loads the
      page, polls getRegistrations() until state === "activated", and reads
      the manifest gives a trustworthy answer in seconds (WS11).
      The Browser pane stays fine for manifest/meta/DOM checks, which need
      no SW.
    prevention: "Any PWA/SW verification (WS12 web push included) runs through Playwright, never the Browser pane. Treat a Browser-pane SW failure as a tooling result, not a bug report."
    stories_encountered: ["WS11"]
    tokens_saved_estimate: "~2000 per occurrence (avoids a full false-positive CSP/nginx hunt)"

# =============================================================================
# ARCHITECTURE PATTERNS
# =============================================================================

architecture:
  - id: "ARCH-001"
    title: "One transaction per request — services flush, routers commit once (CANONICAL)"
    symptoms:
      - "Expense persisted without its CREATED audit entry"
      - "Splits written but status transition lost after a mid-operation failure"
      - "Service functions commit 2-4 times per logical operation"
    root_cause: >
      Two conflicting idioms coexisted: groups service flushed and let the
      caller commit (correct), while expenses service committed internally
      several times per operation. A failure between commits left partial
      writes — for an audit-trail product, "usually written, in a separate
      transaction" is a race, not a guarantee (review B-H5).
    solution: |
      THE canonical pattern (WS4, applied across the expenses feature):
      1. Service functions NEVER call session.commit(). They session.flush()
         so IDs/defaults materialize, and session.refresh() if needed.
      2. Audit entries are session.add()-ed into the SAME transaction as the
         operation they describe — atomic by construction (record_audit
         neither commits nor swallows errors).
      3. The ROUTER (request boundary) commits exactly once, after building
         the response:
         ```python
         result = expense_service.do_thing(session, ...)
         response = PublicSchema.model_validate(result)
         session.commit()
         return response
         ```
      4. Row locks (select(...).with_for_update()) acquired inside the
         service hold until that single commit — check-then-act stays safe.
      WS6 addendum — lazy sweeps on read endpoints: confirmation-policy
      sweeps (auto_confirm_expired_*) run at the top of claim/expense
      read endpoints and commit ONLY when they changed rows
      (`if swept: session.commit()`), then the normal read proceeds. This
      is the stand-in until WS12's scheduler owns expiry.
    prevention: >
      Never commit in a service function. If you see session.commit() below
      the router layer, it's a bug. New mutating endpoints copy the
      router-commits-once shape above.
    stories_encountered: ["WS4", "WS6"]
    tokens_saved_estimate: "~800 per occurrence"

# =============================================================================
# GIT PATTERNS
# =============================================================================

git:
  - id: "GIT-001"
    title: "Pre-commit hook failing on generated files"
    symptoms:
      - "Commit rejected due to formatting"
      - "Auto-generated files don't pass linting"
    root_cause: "Linters running on generated/vendored code"
    solution: |
      Add to `.gitignore` or `.pre-commit-config.yaml`:
      ```yaml
      exclude: |
        (?x)^(
          frontend/src/client/.*|
          migrations/versions/.*
        )$
      ```
    prevention: "Configure exclusions when adding code generation"
    stories_encountered: []
    tokens_saved_estimate: "~200 per occurrence"

  - id: "GIT-002"
    title: "Broad .gitignore patterns silently keep source files out of git"
    symptoms:
      - "File exists locally and everything works, but a fresh clone / CI can't build"
      - "git ls-files doesn't show a file that's clearly part of the app"
    root_cause: |
      Unanchored template patterns match legitimate source paths. WS9.6 found
      three never-committed files: `package.json` (a literal ignore line!)
      hid frontend/package.json, `lib/` hid frontend/src/lib/utils.ts (the
      shadcn cn() helper imported by ~20 components), `build/` hid
      backend/app/email-templates/build/*.html. CI never caught it because it
      only runs on main pushes + PRs, and neither had happened since the
      files appeared.
    solution: |
      Anchor or scope build-output patterns (`/frontend/dist/`, not `dist/`;
      never bare `lib/`/`build/`/`package.json`). Audit for silent victims:
      git ls-files --others --ignored --exclude-standard backend frontend/src
      (anything listed that is source code is a rescue candidate).
    prevention: "After editing .gitignore, run the ls-files audit above; treat any ignored file inside a source directory as a bug"
    stories_encountered: ["WS9.6"]
    tokens_saved_estimate: "~1000 per occurrence"

  - id: "BACKEND-012"
    title: "pywebpush rejects a PEM VAPID private key with an opaque ASN.1 error"
    symptoms:
      - "Web push fails with 'Could not deserialize key data ... ASN.1 parsing error: invalid length'"
      - "The key is a perfectly valid PEM that cryptography loads fine on its own"
    root_cause: |
      `py_vapid.Vapid01.from_string` strips newlines and base64url-DECODES the
      value it is handed — it never expects PEM armor. So the natural thing to
      paste into a VAPID_PRIVATE_KEY env var (a PEM, which is what most key
      generators print) is exactly the thing that fails, and it fails at send
      time in production rather than at boot.
    solution: |
      Store the key base64url-encoded (raw 32-byte scalar OR DER), which is
      what the `web-push` npm CLI emits. Better: normalize at the boundary so
      either form works — `_vapid_private_key()` in
      backend/app/features/notifications/delivery.py converts PEM to
      base64url-DER and passes anything else through.
    prevention: "Exercise the real send path (a local HTTP receiver standing in for the push service) before documenting a key format — reading the library docs would not have caught this"
    stories_encountered: ["WS12"]
    tokens_saved_estimate: "~1500 per occurrence"

  - id: "DOCKER-007"
    title: "Git Bash mangles container-absolute paths in docker compose commands"
    symptoms:
      - "rm: cannot remove 'C:/Program Files/Git/app/...': No such file or directory"
      - "A /app/... path passed to docker compose exec resolves to a Windows path"
    root_cause: |
      MSYS path conversion rewrites any argument that looks like a POSIX
      absolute path into a Windows path before the command ever reaches
      Docker. It hits every `docker compose exec <svc> <cmd> /app/...` and
      every `docker compose cp <svc>:/app/...`.
    solution: |
      Prefix the command with MSYS_NO_PATHCONV=1, e.g.
      MSYS_NO_PATHCONV=1 docker compose exec -T backend alembic upgrade head
    prevention: "On Windows, default to MSYS_NO_PATHCONV=1 for any docker compose command carrying a container path"
    stories_encountered: ["WS12"]
    tokens_saved_estimate: "~400 per occurrence"

  - id: "DOCKER-008"
    title: "Non-root container can't write uv.lock, alembic versions, or .pytest_cache"
    symptoms:
      - "error: failed to create directory `/app/.cache/uv`: Permission denied"
      - "PermissionError writing to /app/app/alembic/versions/<new migration>.py"
    root_cause: |
      WS9's image hardening runs the backend as a non-root USER, but `uv lock`
      and `alembic revision --autogenerate` both write into /app, and only
      tests/ and htmlcov/ are volume-mounted.
    solution: |
      Run just those two commands as root with a writable cache, then copy the
      artifact back to the host:
      docker compose exec -T -u root -e UV_CACHE_DIR=/tmp/uvcache backend uv lock
      docker compose cp backend:/app/uv.lock backend/uv.lock
      docker compose exec -T -u root backend alembic revision --autogenerate -m "..."
      docker compose cp backend:/app/app/alembic/versions/<file> backend/app/alembic/versions/
    prevention: "Only generation commands need -u root; never run the app or pytest as root just to dodge this"
    stories_encountered: ["WS12"]
    tokens_saved_estimate: "~600 per occurrence"

  - id: "TEST-009"
    title: "A test expense never reaches CONFIRMED because the payer's own split is PENDING"
    symptoms:
      - "A freshly created + equal-split + 'confirmed' expense has status PENDING_CONFIRMATION"
      - "Balance/ledger queries filtering on CONFIRMED silently return nothing"
    root_cause: |
      An equal split creates a row for EVERY participant including the payer,
      and each starts PENDING. Finalization requires all of them confirmed, so
      confirming only the non-payer members leaves the expense unfinalized —
      and the test then measures an empty result set, not the behaviour.
    solution: |
      Pass EVERY participant's headers to the confirm loop, payer included:
      _confirmed_expense(client, owner_headers, [owner_headers, member_headers], group_id)
    prevention: "When a query over CONFIRMED rows returns 0 in a test, assert the expense's status before debugging the query — the fixture is the more likely culprit"
    stories_encountered: ["WS12"]
    tokens_saved_estimate: "~800 per occurrence"

  - id: "FE-012"
    title: "flex-1 + min-w-0 collapses copy into a sliver instead of wrapping the row"
    symptoms:
      - "At 375px a card's text renders as a tall ~100px column beside its buttons"
      - "A fixed-width control row (tabs, button group) makes the whole page scroll sideways"
    root_cause: |
      `flex-wrap` only wraps when a child cannot shrink further. `flex-1
      min-w-0` says the text CAN shrink to nothing, so flex starves the copy
      rather than moving the buttons to their own line. Separately, an
      `inline-flex w-fit h-9` control strip (shadcn TabsList) simply overflows
      the viewport when one more item is added — WS12 added a fourth settings
      tab and pushed document.body.scrollWidth to 444 at a 375 viewport.
    solution: |
      For a text-plus-actions row, stack explicitly instead of relying on
      wrap: `flex flex-col gap-3 sm:flex-row sm:items-center` with the actions
      in `sm:ml-auto`. For a control strip that must not overflow, allow
      wrapping AND unset the fixed height: `className="h-auto flex-wrap
      justify-start"`.
    prevention: |
      Measure rather than eyeball. In a Playwright probe:
        document.body.scrollWidth vs document.documentElement.clientWidth
      Any excess is horizontal page scroll on a phone. Both WS12 instances
      passed typecheck, unit tests, build AND 15 e2e journeys — only the DoD
      screenshots caught them, which is what that rule is for.
    stories_encountered: ["WS12"]
    tokens_saved_estimate: "~700 per occurrence"

  - id: "DOCKER-009"
    title: "docker compose cp NESTS instead of overwriting when the target directory exists"
    symptoms:
      - "Code changes have no effect in the container even though cp reported Copied"
      - "alembic check says 'No new upgrade operations detected' for a model field you just added"
      - "A new migration file is invisible to `alembic heads`"
    root_cause: |
      `docker compose cp backend/app backend:/app/app` behaves like `cp -r`:
      when /app/app already exists it creates /app/app/**app**, leaving the
      real source untouched. Every subsequent check then runs against stale
      code and passes, which is worse than failing.
    solution: |
      Always copy the CONTENTS with a trailing /. :
        docker compose cp backend/app/. backend:/app/app
        docker compose cp backend/tests/. backend:/app/tests
      To clean up an existing nesting:
        docker compose exec -u root backend rm -rf /app/app/app
    prevention: |
      After any cp meant to update code, prove it landed before trusting a
      green result — e.g. `docker compose exec backend ls -d /app/app/app`
      (should not exist), or grep the container for a string you just added.
      A gate that passes against stale code is the expensive failure here.
    stories_encountered: ["WS13"]
    tokens_saved_estimate: "~1200 per occurrence"

  - id: "TEST-010"
    title: "A hardcoded `now` tested against relatively-backdated data rots into a false pass"
    symptoms:
      - "A time-sensitive test passes for days, then fails with no code change"
      - "A sweep reports relationships_examined > 0 but every suppressor counter is 0"
    root_cause: |
      Helpers backdate fixtures from the REAL clock (`datetime.now() -
      timedelta(hours=48)`) while the test injects a FIXED instant
      (`datetime(2026, 8, 25, ...)`). On the day it is written the two agree.
      As the calendar moves, the injected `now` drifts into the past relative
      to the backdated row, the record reads as negative-age, and the code
      under test skips it before reaching the branch being asserted.
    solution: |
      Anchor injected time to the same clock the fixtures use, then shift only
      the part that matters:
        now = datetime.now(timezone.utc).replace(hour=23, minute=30, ...)
        later = (now + timedelta(days=1)).replace(hour=10, minute=0)
      Pure functions of an hour (e.g. is_within_quiet_hours) can keep a fixed
      date — they never touch backdated rows.
    prevention: "Grep for `datetime(20` in tests whenever a time-based test starts failing without a code change; and never mix a fixed `now` with a relative fixture"
    stories_encountered: ["WS13"]
    tokens_saved_estimate: "~900 per occurrence"

  - id: "TEST-011"
    title: "Playwright reuses the BUILT frontend container, so visual proof photographs stale UI"
    symptoms:
      - "A screenshot spec passes and writes files, but the new UI is absent from every image"
      - "Screenshots of different states come out byte-identical in size"
    root_cause: |
      The compose `frontend` service publishes 5173 -> container port 80: it
      serves the built production image, not a dev server. Playwright's
      `webServer` has `reuseExistingServer: true`, so it attaches to that
      container and never runs `npm run dev`. Frontend source changes are
      invisible until the image is rebuilt.
    solution: |
      docker compose build frontend && docker compose up -d frontend
      then re-run: npx playwright test --project=visual
    prevention: |
      Make pixel specs assert something falsifiable — that the new text is
      visible, and that document.body.scrollWidth <= viewport width. A spec
      that only captures images cannot tell you it captured the wrong build.
    stories_encountered: ["WS13"]
    tokens_saved_estimate: "~1000 per occurrence"

  - id: "TEST-012"
    title: "fullyParallel e2e tests sharing one account fight over global settings"
    symptoms:
      - "One journey fails roughly 1 run in 3, passes in isolation, and is always green in CI"
      - "locator.click timeout on a control that is enabled when you look at it"
    root_cause: |
      `fullyParallel: true` runs tests from the SAME file concurrently, and
      they all share auth.setup's single storageState. Any test that changes
      an account-level setting changes it underneath its siblings — WS12's
      kill-switch test disables the fieldset the quiet-hours test is clicking.
      CI sets `workers: 1`, so CI never reproduces it.
    solution: |
      For a describe whose tests are ABOUT one account's shared settings:
        test.describe.configure({ mode: "serial" })
      Separately, lock the row on the server for read-modify-write updates
      (`select(...).with_for_update()`) — the same race is a real lost update
      between two of a user's devices, not only a test artifact.
    prevention: "Before giving each test its own user, ask whether the shared resource IS the subject; if so serialize, because isolating it would delete the coverage"
    stories_encountered: ["WS13"]
    tokens_saved_estimate: "~1100 per occurrence"

# =============================================================================
# QUICK REFERENCE (Most Common Issues)
# =============================================================================

quick_reference:
  - trigger: "ModuleNotFoundError in Docker"
    pattern_id: "DOCKER-001"
    quick_fix: "docker compose build --no-cache"

  - trigger: "Connection refused localhost:5432"
    pattern_id: "DOCKER-002"
    quick_fix: "Use service name 'db' instead of 'localhost'"

  - trigger: "ImportError: cannot import name"
    pattern_id: "IMPORT-001"
    quick_fix: "Check for circular imports, use TYPE_CHECKING"

  - trigger: "Route not found 404"
    pattern_id: "FE-001"
    quick_fix: "Check file naming matches TanStack Router conventions"

  - trigger: "Data not updating after mutation"
    pattern_id: "FE-002"
    quick_fix: "Add queryClient.invalidateQueries in onSuccess"

  - trigger: "File changes not visible in Docker"
    pattern_id: "DOCKER-003"
    quick_fix: "docker compose cp local/path container:/path"

  - trigger: "cp reported Copied but the container still runs old code"
    pattern_id: "DOCKER-009"
    quick_fix: "Copy CONTENTS: docker compose cp backend/app/. backend:/app/app (a bare dir nests into /app/app/app)"

  - trigger: "Time-based test starts failing with no code change"
    pattern_id: "TEST-010"
    quick_fix: "A hardcoded datetime(20XX,...) is being compared to relatively-backdated fixtures — anchor now to datetime.now()"

  - trigger: "Screenshot spec passes but the new UI is missing from the images"
    pattern_id: "TEST-011"
    quick_fix: "docker compose build frontend — :5173 serves the BUILT image, and Playwright reuses it"

  - trigger: "One e2e journey flakes ~1 in 3 locally but is green in CI"
    pattern_id: "TEST-012"
    quick_fix: "fullyParallel + shared account; add test.describe.configure({ mode: 'serial' })"

  - trigger: "React is declared but its value is never read"
    pattern_id: "FE-003"
    quick_fix: "Remove unused 'import * as React from \"react\"' - only import specific hooks"

# =============================================================================
# HOW TO ADD NEW PATTERNS
# =============================================================================
#
# When you encounter a new issue:
# 1. Add pattern under appropriate category
# 2. Include: symptoms, root_cause, solution, prevention
# 3. Add to quick_reference if common
# 4. Update metadata.total_patterns count
#
# Example:
#   - id: "CATEGORY-XXX"
#     title: "Brief description"
#     symptoms:
#       - "What you see"
#     root_cause: "Why it happens"
#     solution: |
#       Step by step fix
#     prevention: "How to avoid in future"
#     stories_encountered: ["X.X"]
#     tokens_saved_estimate: "~XXX per occurrence"
