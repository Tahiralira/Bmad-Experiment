# =============================================================================
# DOCKER PATTERNS
# =============================================================================

docker:
  - id: "DOCKER-001"
    title: "Poetry/pip packages not found after container rebuild"
    symptoms:
      - "ModuleNotFoundError in container"
      - "Package installed locally but not in Docker"
    root_cause: "Docker layer caching doesn't pick up new dependencies"
    solution: |
      1. Rebuild without cache: `docker compose build --no-cache backend`
      2. Or copy requirements explicitly in Dockerfile
      3. Or use volume mount for development
    prevention: "Always rebuild containers after adding dependencies"
    stories_encountered: ["1.1", "1.3"]
    tokens_saved_estimate: "~500 per occurrence"

  - id: "DOCKER-002"
    title: "Database connection refused in tests"
    symptoms:
      - "Connection refused to localhost:5432"
      - "Tests pass locally, fail in Docker"
    root_cause: "Container networking - 'localhost' inside container != host"
    solution: |
      Use service name instead of localhost:
      - In docker-compose: `db` not `localhost`
      - Or use `host.docker.internal` for host access
    prevention: "Always use service names in Docker environments"
    stories_encountered: ["1.3"]
    tokens_saved_estimate: "~300 per occurrence"

  - id: "DOCKER-003"
    title: "Windows Docker volume sync lag"
    symptoms:
      - "File changes on Windows host not visible in container"
      - "pytest shows fewer tests than expected"
      - "Code changes don't take effect"
    root_cause: "Windows Docker Desktop volume mounts can have sync delays"
    solution: |
      1. Copy files explicitly: `docker compose cp local/path container:/path`
      2. Or restart container: `docker compose restart backend`
      3. Or check Docker Desktop settings for file sharing
    prevention: "Use docker compose cp when files must sync immediately"
    stories_encountered: ["3.1"]
    tokens_saved_estimate: "~300 per occurrence"

  - id: "DOCKER-004"
    title: "File permissions issues with mounted volumes"
    symptoms:
      - "Permission denied when writing files"
      - "Root-owned files in mounted directories"
    root_cause: "Container runs as root, host has different UID"
    solution: |
      1. Add user mapping in docker-compose:
         ```yaml
         user: "${UID}:${GID}"
         ```
      2. Or set permissions in Dockerfile:
         ```dockerfile
         RUN chown -R app:app /app
         ```
    prevention: "Define user in Dockerfile for development containers"
    stories_encountered: []
    tokens_saved_estimate: "~400 per occurrence"

# =============================================================================
# DATABASE PATTERNS
# =============================================================================

database:
  - id: "DB-001"
    title: "Alembic migration conflicts"
    symptoms:
      - "Multiple heads detected"
      - "Target database is not up to date"
    root_cause: "Multiple developers created migrations from same base"
    solution: |
      1. Check heads: `alembic heads`
      2. Merge: `alembic merge -m "merge" rev1 rev2`
      3. Or delete conflicting migration and regenerate
    prevention: "Always pull latest before creating migrations"
    stories_encountered: []
    tokens_saved_estimate: "~600 per occurrence"

  - id: "DB-002"
    title: "SQLModel relationship not loading"
    symptoms:
      - "Related objects are None"
      - "Lazy loading not working"
    root_cause: "SQLModel requires explicit relationship configuration"
    solution: |
      Use `Relationship` with `back_populates`:
      ```python
      class User(SQLModel, table=True):
          items: list["Item"] = Relationship(back_populates="owner")

      class Item(SQLModel, table=True):
          owner_id: uuid.UUID = Field(foreign_key="user.id")
          owner: User = Relationship(back_populates="items")
      ```
    prevention: "Always define both sides of relationships"
    stories_encountered: ["1.3", "2.1"]
    tokens_saved_estimate: "~400 per occurrence"

# =============================================================================
# IMPORT / CIRCULAR DEPENDENCY PATTERNS
# =============================================================================

imports:
  - id: "IMPORT-001"
    title: "Circular import between feature modules"
    symptoms:
      - "ImportError: cannot import name X"
      - "Partially initialized module"
    root_cause: "Module A imports B, B imports A"
    solution: |
      Options (in order of preference):
      1. Move shared types to a common module
      2. Use TYPE_CHECKING for type hints only:
         ```python
         from typing import TYPE_CHECKING
         if TYPE_CHECKING:
             from app.features.groups.models import ExpenseGroup
         ```
      3. Import inside function (last resort, add comment explaining why)
    prevention: "Plan module dependencies before implementing"
    stories_encountered: ["2.4"]
    tokens_saved_estimate: "~300 per occurrence"
    example_file: "backend/app/features/auth/service.py:266"

# =============================================================================
# FRONTEND PATTERNS
# =============================================================================

frontend:
  - id: "FE-001"
    title: "TanStack Router file-based route not found"
    symptoms:
      - "Route not matching"
      - "404 on navigation"
    root_cause: "File naming must match route pattern exactly"
    solution: |
      Route structure:
      - `/` → `routes/_layout/index.tsx`
      - `/groups` → `routes/_layout/groups/index.tsx`
      - `/groups/:id` → `routes/_layout/groups/$id.tsx`

      Use `_layout` prefix for layout routes.
    prevention: "Check TanStack Router docs for file conventions"
    stories_encountered: ["2.4"]
    tokens_saved_estimate: "~200 per occurrence"

  - id: "FE-002"
    title: "TanStack Query not refetching after mutation"
    symptoms:
      - "Data stale after create/update"
      - "Need to refresh to see changes"
    root_cause: "Query cache not invalidated"
    solution: |
      Invalidate queries after mutation:
      ```typescript
      const queryClient = useQueryClient()

      const mutation = useMutation({
        mutationFn: createGroup,
        onSuccess: () => {
          queryClient.invalidateQueries({ queryKey: ["groups"] })
        },
      })
      ```
    prevention: "Always invalidate related queries in mutation onSuccess"
    stories_encountered: ["2.1"]
    tokens_saved_estimate: "~250 per occurrence"

  - id: "FE-003"
    title: "TypeScript error: 'React' is declared but its value is never read"
    symptoms:
      - "TS6133: 'React' is declared but its value is never read"
      - "Build fails with unused import warning"
    root_cause: "React 17+ with new JSX transform doesn't require importing React for JSX"
    solution: |
      Remove unused React import:
      ```typescript
      // WRONG - React import not needed for JSX
      import * as React from "react"
      import { useMemo } from "react"

      // CORRECT - Import only what you use
      import { useMemo } from "react"
      ```
    prevention: "Only import React when using React-specific APIs (React.useRef, React.ComponentType, etc.)"
    stories_encountered: ["2.5.6"]
    tokens_saved_estimate: "~100 per occurrence"

  - id: "FE-005"
    title: "Optimistic UI without error recovery leaves UI stuck"
    symptoms:
      - "Card/button shows 'success' state optimistically"
      - "If actual API call fails, UI stays in success state permanently"
      - "User cannot retry or revert"
    root_cause: "Optimistic state set to true but never reset on mutation error"
    solution: |
      Always add a useEffect to revert optimistic state on error:
      ```typescript
      const [isOptimistic, setIsOptimistic] = useState(false)

      // Revert on mutation failure
      useEffect(() => {
        if (mutation.isError && isOptimistic) {
          setIsOptimistic(false)
        }
      }, [mutation.isError, isOptimistic])
      ```
    prevention: "For every optimistic UI update, add error recovery that resets the optimistic state"
    stories_encountered: ["5.1"]
    tokens_saved_estimate: "~300 per occurrence"

  - id: "FE-004"
    title: "Numbers look unnatural in UI - tabular vs proportional figures"
    symptoms:
      - "Numbers in text don't flow naturally"
      - "Monospace appearance in headings/body text"
    root_cause: "Using tabular-nums instead of proportional-nums for inline text"
    solution: |
      Use proportional-nums for UI numbers:
      ```css
      /* WRONG - Makes numbers monospaced */
      .number { font-variant-numeric: tabular-nums; }

      /* CORRECT - Numbers flow with text */
      .number { font-variant-numeric: proportional-nums; }
      ```
      In Tailwind:
      ```tsx
      // WRONG
      className="tabular-nums"

      // CORRECT
      className="proportional-nums"
      ```
      Only use tabular-nums for data tables where alignment matters.
    prevention: "Default to proportional-nums for all UI text. Use tabular-nums only for financial tables/spreadsheets."
    stories_encountered: ["2.5.6"]
    tokens_saved_estimate: "~50 per occurrence"

# =============================================================================
# TESTING PATTERNS
# =============================================================================

testing:
  - id: "TEST-001"
    title: "Pytest fixture not found"
    symptoms:
      - "fixture 'X' not found"
    root_cause: "Fixture not in conftest.py or wrong scope"
    solution: |
      1. Check fixture is in `conftest.py` (not just test file)
      2. Check fixture scope matches usage
      3. Check fixture name matches exactly (case-sensitive)
    prevention: "Keep fixtures in conftest.py at appropriate level"
    stories_encountered: []
    tokens_saved_estimate: "~150 per occurrence"

  - id: "TEST-002"
    title: "Test database not cleaned between tests"
    symptoms:
      - "Tests pass individually, fail together"
      - "Duplicate key errors"
    root_cause: "Database state leaking between tests"
    solution: |
      Use transaction rollback or truncate:
      ```python
      @pytest.fixture
      def db(session):
          yield session
          session.rollback()  # Rollback after each test
      ```
    prevention: "Use session-scoped fixtures with rollback"
    stories_encountered: ["1.4"]
    tokens_saved_estimate: "~400 per occurrence"

  - id: "TEST-003"
    title: "String-prefix ValueError for HTTP status code translation"
    symptoms:
      - "Service raises ValueError('NOT_FOUND:...') or ValueError('CONFLICT:...')"
      - "Router parses string prefix to determine HTTP status code"
    root_cause: "Inconsistent error handling pattern — dev invents ad-hoc error translation instead of following existing pattern"
    solution: |
      Use the EXISTING pattern from confirm/reject endpoints:
      1. Router does validation (404 check, status guard) with HTTPException directly
      2. Service does business logic and returns result or sentinel value
      3. Router translates sentinel values to appropriate HTTP status

      WRONG (fragile string-prefix):
      ```python
      # service.py
      raise ValueError("NOT_FOUND:Expense not found")

      # router.py
      except ValueError as e:
          if str(e).startswith("NOT_FOUND:"):
              raise HTTPException(status_code=404, ...)
      ```

      CORRECT (consistent with existing endpoints):
      ```python
      # router.py — validation here
      expense = session.get(Expense, expense_id)
      if not expense:
          raise HTTPException(status_code=404, detail="Expense not found")

      result = expense_service.settle_expense_split(session, expense_id, user_id)
      if not result:
          raise HTTPException(status_code=403, detail="Not involved")
      ```
    prevention: "Always check how EXISTING endpoints handle errors before inventing new patterns"
    stories_encountered: ["5.1"]
    tokens_saved_estimate: "~500 per occurrence"

  - id: "BE-002"
    title: "'Check all X done' pattern ignores entity owner's own record"
    symptoms:
      - "Expense/split never transitions to final status (SETTLED, CONFIRMED)"
      - "check_all_splits_X() returns False even after all non-owner members completed their action"
      - "One split remains in previous status — the payer/creator's own split"
    root_cause: "In split-based workflows, the expense payer/creator also has a split. When other members settle/confirm, the payer's split isn't explicitly handled because 'the payer doesn't owe themselves.' But the check-all function requires ALL splits."
    solution: |
      When processing the last member action (e.g., settlement confirmation), also auto-settle the payer's split:
      ```python
      # In confirm_settlement_claim, after settling claimant's split:
      payer_split = session.exec(
          select(ExpenseSplit)
          .where(ExpenseSplit.expense_id == expense.id)
          .where(ExpenseSplit.user_id == expense.payer_id)
      ).first()
      if payer_split and payer_split.status != SplitStatus.SETTLED:
          payer_split.status = SplitStatus.SETTLED
          session.add(payer_split)
      ```
    prevention: "When using 'check all X' patterns, verify whether ALL entities can realistically reach the target status, or if the owner's record needs auto-transition"
    stories_encountered: ["5.2"]
    tokens_saved_estimate: "~600 per occurrence"

# =============================================================================
# GIT PATTERNS
# =============================================================================

git:
  - id: "GIT-001"
    title: "Pre-commit hook failing on generated files"
    symptoms:
      - "Commit rejected due to formatting"
      - "Auto-generated files don't pass linting"
    root_cause: "Linters running on generated/vendored code"
    solution: |
      Add to `.gitignore` or `.pre-commit-config.yaml`:
      ```yaml
      exclude: |
        (?x)^(
          frontend/src/client/.*|
          migrations/versions/.*
        )$
      ```
    prevention: "Configure exclusions when adding code generation"
    stories_encountered: []
    tokens_saved_estimate: "~200 per occurrence"

